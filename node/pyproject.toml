[project]
name = "seal-node"
version = "0.1.0"
description = "SealShell local WebSocket-to-TCP/UDP transport node"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<14",
    "cryptography>=43",
    "protobuf>=5.29,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "asyncssh>=2.19,<3",
    "grpcio-tools>=1.70,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seal"]
