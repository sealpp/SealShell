syntax = "proto3";

package seal;

message SealMessage {
  uint32 protocol_version = 1;
  string request_id = 2;

  oneof body {
    PairBegin pair_begin = 10;
    PairChallenge pair_challenge = 11;
    PairProof pair_proof = 12;
    PairSucceeded pair_succeeded = 13;

    AuthBegin auth_begin = 20;
    AuthChallenge auth_challenge = 21;
    AuthProof auth_proof = 22;
    AuthSucceeded auth_succeeded = 23;

    TransportOpenRequest transport_open_request = 30;
    TransportOpenedEvent transport_opened_event = 31;
    TransportData transport_data = 32;
    TransportCredit transport_credit = 33;
    TransportHalfCloseRequest transport_half_close_request = 34;
    TransportCloseRequest transport_close_request = 35;
    TransportClosedEvent transport_closed_event = 36;
    TransportErrorEvent transport_error_event = 37;
    TransportEofEvent transport_eof_event = 38;
    FsRequest fs_request = 40;
    FsResponse fs_response = 41;
    TcpListenRequest tcp_listen_request = 50;
    TcpListeningEvent tcp_listening_event = 51;
    TcpAcceptedEvent tcp_accepted_event = 52;
    TcpListenerCloseRequest tcp_listener_close_request = 53;
    TcpListenerClosedEvent tcp_listener_closed_event = 54;
  }
}

message PairBegin {
  string pairing_code = 1;
  string device_id = 2;
  string device_name = 3;
  bytes device_public_key = 4;
  bytes client_nonce = 5;
}

message PairChallenge {
  string pairing_id = 1;
  string node_id = 2;
  bytes node_public_key = 3;
  bytes node_nonce = 4;
}

message PairProof {
  string pairing_id = 1;
  bytes device_signature = 2;
}

message PairSucceeded {
  string device_id = 1;
  string node_id = 2;
  bytes node_public_key = 3;
}

message AuthBegin {
  string device_id = 1;
  string connection_id = 2;
  bytes client_nonce = 3;
}

message AuthChallenge {
  string connection_id = 1;
  string node_id = 2;
  bytes node_public_key = 3;
  bytes node_nonce = 4;
  bytes node_signature = 5;
}

message AuthProof {
  string connection_id = 1;
  bytes device_signature = 2;
}

message AuthSucceeded {
  string device_id = 1;
  string node_id = 2;
}

message TransportOpenRequest {
  uint32 stream_id = 1;
  string transport = 2;
  string host = 3;
  uint32 port = 4;
}

message TransportOpenedEvent {
  uint32 stream_id = 1;
  string transport = 2;
  uint64 input_credit_bytes = 3;
  uint64 output_credit_bytes = 4;
}

message TransportData {
  uint32 stream_id = 1;
  uint64 sequence = 2;
  bytes payload = 3;
}

message TransportCredit {
  uint32 stream_id = 1;
  string direction = 2;
  uint64 add_bytes = 3;
}

message TransportHalfCloseRequest {
  uint32 stream_id = 1;
}

message TransportCloseRequest {
  uint32 stream_id = 1;
  string reason = 2;
}

message TransportClosedEvent {
  uint32 stream_id = 1;
  string reason = 2;
}

message TransportErrorEvent {
  uint32 stream_id = 1;
  string code = 2;
  string message = 3;
}

message TransportEofEvent { uint32 stream_id = 1; }

// Listeners and accepted streams are owned by the authenticated connection.
// Port 0 requests an OS-assigned port. Node does not choose fallback ports.
message TcpListenRequest {
  uint32 listener_id = 1;
  string host = 2;
  uint32 port = 3;
}
message TcpListeningEvent {
  uint32 listener_id = 1;
  string host = 2;
  uint32 port = 3;
}
message TcpAcceptedEvent {
  uint32 listener_id = 1;
  uint32 stream_id = 2;
  string peer_host = 3;
  uint32 peer_port = 4;
  uint64 input_credit_bytes = 5;
  uint64 output_credit_bytes = 6;
}
// Closing a listener stops accepting. Existing streams have their own lifetime.
message TcpListenerCloseRequest { uint32 listener_id = 1; }
message TcpListenerClosedEvent { uint32 listener_id = 1; }

// File handles and directory cursors belong to the authenticated WS connection.
message FsRequest {
  oneof operation {
    FsInfoRequest info = 1;
    FsPath stat = 2;
    FsPath open_directory = 3;
    FsHandle read_directory = 4;
    FsOpen open = 5;
    FsRead read = 6;
    FsWrite write = 7;
    FsHandle close = 8;
    FsPath mkdir = 9;
    FsPath remove = 10;
    FsRename rename = 11;
    FsSetTime set_time = 12;
    FsPath read_link = 13;
    FsSymlink symlink = 14;
  }
}

message FsInfoRequest {}
message FsPath { string path = 1; bool follow_links = 2; }
message FsHandle { uint64 handle = 1; }
message FsOpen {
  string path = 1;
  bool write = 2;
  bool create = 3;
  bool exclusive = 4;
  bool truncate = 5;
}
message FsRead { uint64 handle = 1; uint64 offset = 2; uint32 length = 3; }
message FsWrite { uint64 handle = 1; uint64 offset = 2; bytes payload = 3; }
message FsRename { string source = 1; string target = 2; bool replace = 3; }
message FsSetTime { string path = 1; int64 modified_at_ms = 2; }
message FsSymlink { string path = 1; string target = 2; bool directory = 3; }

message FsResponse {
  oneof result {
    FsInfo info = 1;
    FsEntry stat = 2;
    FsHandle opened = 3;
    FsDirectoryPage directory = 4;
    FsReadResult read = 5;
    FsWriteResult written = 6;
    FsSuccess success = 7;
    FsError error = 8;
    FsLinkTarget link = 9;
  }
}
message FsInfo {
  string platform = 1;
  string home = 2;
  repeated string roots = 3;
  uint32 max_chunk_bytes = 4;
  uint32 max_handles = 5;
}
message FsEntry {
  string name = 1;
  string path = 2;
  string kind = 3;
  uint64 size = 4;
  int64 modified_at_ms = 5;
  uint32 mode = 6;
  bool hidden = 7;
}
message FsDirectoryPage { repeated FsEntry entries = 1; bool eof = 2; }
message FsReadResult { bytes payload = 1; bool eof = 2; }
message FsWriteResult { uint32 bytes_written = 1; }
message FsSuccess {}
message FsError { string code = 1; string message = 2; }
message FsLinkTarget { string target = 1; }
