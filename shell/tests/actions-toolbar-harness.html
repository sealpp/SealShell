<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actions Toolbar Harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #1e1e1e; }
      .test-layout { width: 100%; height: 100%; display: flex; min-width: 0; overflow: hidden; }
      .shell-workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .main-dock-container {
        --actions-toolbar-width: 44px;
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .panel { flex: 0 0 120px; background: #252526; }
      .panel.collapsed { flex-basis: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import 'dockview-vue/dist/styles/dockview.css'
      import '/src/services/actions'
      import ActionsToolbar from '/src/views/ActionsToolbar.vue'
      import MainDock from '/src/views/MainDock.vue'
      import { store } from '/src/stores/app'

      function createTab(id) {
        return {
          id,
          kind: 'terminal',
          hostId: `host-${id}`,
          label: id,
          state: 'idle',
          error: '',
          streamId: 0,
          sessionId: `session-${id}`,
          terminalId: `terminal-${id}`,
          telemetry: null,
          encoding: 'utf-8',
        }
      }

      store.tabs.splice(0, store.tabs.length, createTab('tab-a'), createTab('tab-b'))
      store.activeTerminalTabId = 'tab-a'
      store.view = 'shell'
      store.panelOpen = true

      createApp({
        render() {
          return h('main', { class: 'test-layout' }, [
            h('section', { class: 'shell-workspace' }, [
              h('div', { class: 'main-dock-container' }, [
                h(MainDock),
                h(ActionsToolbar),
              ]),
            ]),
            h('aside', { class: ['panel', { collapsed: !store.panelOpen }] }),
          ])
        },
      }).mount('#app')
    </script>
  </body>
</html>
