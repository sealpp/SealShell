<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><title>Terminal suggestions integration</title>
    <style>html,body,#app{margin:0;width:100%;height:100%;background:#0d0d0d;color:#ddd}#app{box-sizing:border-box;padding:24px}</style>
  </head>
  <body><div id="app"></div><script type="module">
    import { createApp, h } from 'vue'
    import '/src/services/actions'
    import '/src/styles/workbench.css'
    import ShellTerminal from '/src/views/ShellTerminal.vue'
    import { store } from '/src/stores/app'
    import { saveHost } from '/src/services/storage'
    await saveHost({ id: 'production-host', name: 'Test', address: 'test.invalid', port: 22, username: 'dev', folderId: null })
    store.tabs.push({ id: 'production-tab', kind: 'terminal', hostId: 'production-host', label: 'Test', state: 'online', error: '', sessionId: 'production-session', terminalId: 'production-terminal', encoding: 'utf-8' })
    store.activeTerminalTabId = 'production-tab'
    createApp({ render: () => h(ShellTerminal, { tabId: 'production-tab' }) }).mount('#app')
  </script></body>
</html>
