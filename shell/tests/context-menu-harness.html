<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextMenu Harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #111; }
      #trigger { position: fixed; top: 120px; right: 1px; width: 1px; height: 1px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
import "/tests/native-mock.ts"
      import { createApp, h } from 'vue'
      import '/src/styles/workbench.css'
      import CommandContextMenu from '/src/components/CommandContextMenu.vue'
      import { commandRegistry, menuRegistry } from '/src/services/commands'

      window.lastCommand = ''

      const register = (id, label, options = {}) => {
        commandRegistry.register({
          id,
          label,
          execute: () => { window.lastCommand = id },
          ...options,
        })
      }

      register('test.second.disabled', '禁用项', { enabled: () => false })
      register('test.second.leaf', '二级普通项')
      register('test.third.disabled', '三级禁用项', { enabled: () => false })
      register('test.third.first', '三级第一项')
      register('test.third.second', '三级第二项')
      register('test.root.leaf', '一级普通项')

      menuRegistry.register('test.context', [
        {
          kind: 'submenu',
          id: 'test.root.submenu',
          label: '一级子菜单',
          items: [
            { kind: 'command', commandId: 'test.second.disabled' },
            { kind: 'command', commandId: 'test.second.leaf' },
            {
              kind: 'submenu',
              id: 'test.second.submenu',
              label: '二级子菜单',
              items: [
                { kind: 'command', commandId: 'test.third.disabled' },
                { kind: 'command', commandId: 'test.third.first' },
                { kind: 'command', commandId: 'test.third.second' },
              ],
            },
          ],
        },
        { kind: 'command', commandId: 'test.root.leaf' },
      ])

      createApp({
        render() {
          return h(CommandContextMenu, {
            menuId: 'test.context',
            context: { area: 'global' },
          }, {
            default: () => h('div', { id: 'trigger' }),
          })
        },
      }).mount('#app')
    </script>
  </body>
</html>
