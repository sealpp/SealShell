<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Terminal file drop</title>
<style>html,body,#app{margin:0;width:100%;height:100%;background:#181818;color:#ccc}#app{display:flex;gap:8px;padding:16px;box-sizing:border-box}.pane{flex:1;min-width:0;height:400px}</style></head>
<body><div id="app"></div><script type="module">
import { nativeFixture } from '/tests/native-mock.ts'
import { createApp, h } from 'vue'
import '/src/services/actions'
import '/src/styles/workbench.css'
import ShellTerminal from '/src/views/ShellTerminal.vue'
import { store } from '/src/stores/app'
import { connectSsh } from '/src/services/ssh'
import { preventFileNavigation } from '/src/services/terminalFileDrop'
nativeFixture.handlers.ssh_connect = () => {}
nativeFixture.handlers.ssh_exec = () => ({ stdout: [], stderr: [], exitCode: 1 })
nativeFixture.handlers.ssh_shell = () => {}
nativeFixture.handlers.ssh_resize = () => {}
for (const id of ['left', 'right']) {
  await connectSsh({ sessionId: id, host: `${id}.example`, port: 22, username: 'alice', password: 'fixture' }, () => {}, () => {}, { columns: 80, rows: 24 })
  store.tabs.push({ id, kind: 'terminal', label: id, state: 'online', error: '', sessionId: id, terminalId: id, encoding: 'utf-8', cwd: `/srv/${id}` })
}
store.activeTerminalTabId = 'left'
window.dropFixture = { store }
preventFileNavigation(document)
createApp({ render: () => ['left', 'right'].map(id => h('div', { class: 'pane', 'data-pane': id }, [h(ShellTerminal, { tabId: id })])) }).mount('#app')
</script></body></html>
