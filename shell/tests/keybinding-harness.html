<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keybinding Harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #111; color: #fff; }
      main { display: grid; gap: 8px; padding: 16px; }
      input, [contenteditable="true"] { width: 180px; height: 28px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, reactive } from 'vue'
      import '/src/services/actions'
      import { keybindingService, registerAction } from '/src/services/commands'

      const state = reactive({ count: 0 })
      registerAction({
        id: 'test.keybinding',
        title: 'Test keybinding',
        when: 'area == "global" && tabExists',
        run: () => { state.count += 1 },
        keybindings: [{ key: 'Mod+K' }],
      })

      keybindingService.attach(window, () => ({ area: 'global', tabId: 'test-tab' }))
      window.getTestLabel = () => keybindingService.getLabel('test.keybinding') || ''

      createApp({
        render() {
          return h('main', {}, [
            h('output', { id: 'count' }, String(state.count)),
            h('output', { id: 'label' }, keybindingService.getLabel('test.keybinding') || ''),
            h('input', { id: 'input' }),
            h('div', { id: 'editable', contenteditable: 'true' }),
          ])
        },
      }).mount('#app')
    </script>
  </body>
</html>
