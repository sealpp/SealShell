<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Proxy settings</title><style>html,body,#app{height:100%;margin:0;background:#111;color:#ccc}</style></head>
<body><div id="app"></div><script type="module">
import "/tests/native-mock.ts"
import { createApp, h } from 'vue'
import '/src/styles/workbench.css'
import { store } from '/src/stores/app'
import { listHosts, saveHost } from '/src/services/storage'
import { loadProxyProfiles } from '/src/services/proxy/profiles'
import SettingsDialog from '/src/components/SettingsDialog.vue'
import HostFormView from '/src/views/HostFormView.vue'
import InteractionDialog from '/src/components/InteractionDialog.vue'
await loadProxyProfiles()
store.hosts = await listHosts()
if (!store.hosts.length) {
  const host = { id: 'server', name: 'Test server', address: 'internal.example', port: 22, username: 'root', folderId: null }
  await saveHost(host)
  store.hosts = [host]
}
store.settingsSection = 'proxies'
store.settingsModalOpen = true
createApp({ render() { return h('main', [
  h('button', { onClick: () => { store.settingsModalOpen = true } }, '打开设置'),
  h('button', { onClick: () => { store.editingHostId = 'server'; store.connectionModalOpen = true } }, '编辑测试主机'),
  store.settingsModalOpen ? h(SettingsDialog) : null,
  store.connectionModalOpen ? h(HostFormView) : null,
  h(InteractionDialog),
]) } }).mount('#app')
</script></body></html>
